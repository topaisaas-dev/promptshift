name: PromptShift X (Twitter) Autonomous DevRel

on:
  schedule:
    # 08:30 UTC (EU Morning Peak)
    # 14:30 UTC (10:30 AM EST - US East Morning Peak)
    # 18:30 UTC (EU Evening / US Midday Peak)
    # 22:30 UTC (02:30 PM PST - US West Afternoon Peak)
    - cron: '30 8,14,18,22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate broadcast without hitting X API'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: ⚡ Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 🚀 Run Autonomous DevRel Engine
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_3K_API_KEY: ${{ secrets.X_3K_API_KEY }}
          X_3K_API_SECRET: ${{ secrets.X_3K_API_SECRET }}
          X_3K_ACCESS_TOKEN: ${{ secrets.X_3K_ACCESS_TOKEN }}
          X_3K_ACCESS_TOKEN_SECRET: ${{ secrets.X_3K_ACCESS_TOKEN_SECRET }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          node --experimental-strip-types scripts/x-autopilot.ts

      - name: 💾 Commit & Sync Broadcast History
        run: |
          git config user.name "PromptShift Autopilot [bot]"
          git config user.email "bot@promptshift.dev"
          git add data/x_posts_history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(telemetry): record x devrel broadcast [skip ci]"
            git push
          else
            echo "No history update to commit."
          fi
